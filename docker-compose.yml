# Entorno de desarrollo. Uso: docker compose up --build
# Probar la imagen de producción: docker compose --profile produccion up --build app

name: golden-screen

services:
  web:
    build:
      context: .
      target: dev
    command: npm run dev -w client -- --host
    ports:
      - "5173:5173"
    environment:
      API_PROXY: http://api:3001
      # En Windows y macOS los cambios de archivos no llegan al contenedor por eventos.
      VITE_USE_POLLING: "true"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
    depends_on:
      - api

  api:
    build:
      context: .
      target: dev
    command: npm run dev -w server
    ports:
      - "3001:3001"
    environment: &api_env
      PORT: 3001
      APP_URL: http://localhost:5173
      SESSION_SECRET: ${SESSION_SECRET:-golden-screen-desarrollo}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: golden_screen
      # Cuenta del administrador que se crea al sembrar la base vacía.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
    depends_on:
      db:
        condition: service_healthy

  # La misma imagen que se publica en GitHub Container Registry y corre en Render.
  app:
    profiles: [produccion]
    build:
      context: .
      target: prod
    ports:
      - "8080:3001"
    environment:
      <<: *api_env
      APP_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # Solo accesible desde esta máquina, no desde la red. 3307 para no chocar con un MySQL local.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # Datos de MySQL: sobreviven a reinicios y a `docker compose down`.
  db_data:
  # Dependencias instaladas dentro del contenedor (Linux), separadas de las de Windows.
  node_modules:
  client_node_modules:
  server_node_modules:
