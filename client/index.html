<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Golden Screen Cinema: cartelera, elección de butacas y compra de entradas en línea." />
    <meta name="theme-color" content="#2E0912" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Golden Screen Cinema</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
      try {
        var tema = localStorage.getItem('gs-tema');
        if (tema === 'claro' || tema === 'oscuro') document.documentElement.dataset.tema = tema;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
